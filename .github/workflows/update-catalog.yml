name: Refresh Skills Library catalog

on:
  schedule:
    - cron: '17 4 * * 1'   # every Monday, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'data/sources.json'
      - 'scripts/build_catalog.py'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build catalog from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_catalog.py

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Check website JavaScript
        run: node --check assets/app.js

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/catalog.js data/discovered.json CATALOG.md llms.txt README.md README.pl.md
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: refresh Skills Library catalog [skip ci]"
            git push
          fi
